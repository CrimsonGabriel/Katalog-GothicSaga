<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krawiec</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../sg.ico" type="image/webp" />
</head>
<body>
  <div class="background"></div>
  <div id="credits-placeholder"></div>
  <div class="styled-wrapper">
  <button class="buttonq" onclick="window.location.href='../index.html'">
    <div class="buttonq-box">
      <span class="buttonq-elem">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="arrow-icon">
          <path fill="white" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
        </svg>
      </span>
      <span class="buttonq-elem">
        <svg fill="white" viewBox="0 0  24 24" xmlns="http://www.w3.org/2000/svg" class="arrow-icon">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
        </svg>
      </span>
    </div>
  </button>
</div>

  <h1 class="main-title">Zawód: Krawiec</h1>

  <section class="main-grid">
	
	<a href="ubrania.html" class="main-card">
      <img src="../assets/img/ubrania.webp" alt="Ubrania" />
      <div class="card-overlay">Ubrania</div>
   </a>
  
   <a href="kaletnik.html" class="main-card">
      <img src="../assets/img/kaletnik.webp" alt="Kaletnik" />
      <div class="card-overlay">Kaletnik</div>
   </a>

    <a href="kusnierz.html" class="main-card">
      <img src="../assets/img/kusnierz.webp" alt="Kuśnierz" />
      <div class="card-overlay">Kuśnierz</div>
    </a>
  </section>
</body>
<script>
  // Skrypt ładujący zewnętrzny plik HTML
  fetch('../credits.html') // upewnij się, że ścieżka jest poprawna (jeśli kowal.html jest w folderze, daj '../credits.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('credits-placeholder').innerHTML = data;
    });
</script>
</html>
